<style>
/* Layout: 上に試練の種類と相手属性、合計スコア。その下に5人のカード（各カードに内訳・パッシブ・鍛錬・シール） */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#141C33; --muted:#5D6681; --line:#D5DAE6;
  --volt:#FFD21F; --volt-ink:#141C33; --blue:#2147B8; --blue-soft:#E3E9FA;
  --on:#1D8A4E; --off:#9AA1B4; --cond:#B26A00; --cond-soft:#FFF1D6; --warn:#B3261E; --warn-soft:#FBE7E7;
  --fire:#D93B3F; --mount:#A8681F; --wind:#1F8BC4; --wood:#2F8F4E;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"Chakra Petch","Zen Kaku Gothic New",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1222; --surface:#161D33; --surface-2:#1C2540; --ink:#E9EDF7; --muted:#9AA3BE; --line:#2C3656;
  --blue:#8DA8FF; --blue-soft:#22305A; --on:#4FD08A; --off:#5E6782; --cond:#FFB84D; --cond-soft:#3A2E17; --warn:#FF8A80; --warn-soft:#3D1D22;
  --fire:#FF6B6E; --mount:#E0A253; --wind:#5BC0F0; --wood:#5FCB80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#161D33; --surface-2:#1C2540; --ink:#E9EDF7; --muted:#9AA3BE; --line:#2C3656;
  --blue:#8DA8FF; --blue-soft:#22305A; --on:#4FD08A; --off:#5E6782; --cond:#FFB84D; --cond-soft:#3A2E17; --warn:#FF8A80; --warn-soft:#3D1D22;
  --fire:#FF6B6E; --mount:#E0A253; --wind:#5BC0F0; --wood:#5FCB80; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.bolt{width:38px;height:38px;flex:none;background:var(--volt);clip-path:polygon(58% 0,10% 56%,44% 56%,34% 100%,90% 40%,55% 40%)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4vw,30px);line-height:1.15;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:700;font-size:14px;min-width:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg.big button{padding:9px 18px;font-size:15px}
.seg.attr button[aria-pressed="true"][data-v="火"]{background:var(--fire);color:#fff}
.seg.attr button[aria-pressed="true"][data-v="山"]{background:var(--mount);color:#fff}
.seg.attr button[aria-pressed="true"][data-v="風"]{background:var(--wind);color:#fff}
.seg.attr button[aria-pressed="true"][data-v="林"]{background:var(--wood);color:#fff}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end}
.bar .sealtg{margin-left:auto;height:38px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px}
.fld select,.fld input{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--blue)}

/* 画面の並び：設定＋スコア → 編成を組む → 5人のカード */
.toolp{margin-top:12px}
.toolp .optbar{margin-top:0;padding-top:0;border-top:0}
.bar{gap:14px 24px;align-items:flex-start}
.bar>div{min-width:0}
.cores input{padding:0 4px;text-align:center;font-family:var(--f-num);font-weight:700;font-size:15px}
@media (max-width:560px){.bar{gap:12px 14px}.bar .seg button{padding:7px 12px}}
/* 合計 */
.total{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:16px 28px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
@media (max-width:700px){.total{grid-template-columns:1fr}}
.tbig .k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.tbig .v{font-family:var(--f-num);font-weight:700;font-size:clamp(34px,6vw,48px);line-height:1.05;font-variant-numeric:tabular-nums}
.tbig .x{font-family:var(--f-num);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.minis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:560px){.minis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mini{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.mini .n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .s{font-family:var(--f-num);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.mini .s.zero{color:var(--off)}
.clubsum{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.clubsum .mini{flex:1 1 140px}

/* カード */
.slots{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}
@media (min-width:980px){.slots{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--attr,var(--line))}
.chead{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}.chead .mv{margin-left:auto}
.num{font-family:var(--f-display);font-size:20px;line-height:1}
.as{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--surface);min-width:64px;text-align:center;flex:none}
.mv{display:inline-flex;gap:4px;flex:none}
.mv button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;font-weight:700}
.mv button:hover:not(:disabled){border-color:var(--ink)}
.mv button:disabled{opacity:.3;cursor:default}
.chead select{flex:1 1 100%;order:3;min-width:0;width:100%;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-weight:700;font-size:15px;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.chip.a-火{color:var(--fire);border-color:var(--fire)} .chip.a-山{color:var(--mount);border-color:var(--mount)}
.chip.a-風{color:var(--wind);border-color:var(--wind)} .chip.a-林{color:var(--wood);border-color:var(--wood)}
.chip.good{color:var(--on);border-color:var(--on)} .chip.bad{color:var(--warn);border-color:var(--warn)}
.inputs{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px;align-items:end}
@media (max-width:520px){.inputs{grid-template-columns:1fr 1fr}.inputs .tech{grid-column:1/-1}}
.inputs label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
.inputs .fl{display:block;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inputs .fl small{font-weight:400;margin-left:2px}
.inputs select,.inputs input{width:100%;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.inputs input{font-family:var(--f-num);font-size:17px;font-weight:700}
.tattr{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;font-weight:700;color:var(--muted)}
.tattr span{margin-right:4px}
.tattr button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:2px 9px;font-size:12px;font-weight:700}
.tattr button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.res{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 14px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}.res:empty{display:none}
.res .rf{display:flex;flex-wrap:wrap;gap:4px 16px}
.res .f{display:flex;flex-direction:column;font-size:11px;color:var(--muted);line-height:1.3}.res .f small{font-size:11px}
.res .f b{font-family:var(--f-num);color:var(--ink);font-size:15px}
.res .sc{margin-left:auto;font-family:var(--f-num);font-weight:700;font-size:26px;line-height:1.1;white-space:nowrap}
.res .sc small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500;margin-right:6px}
.empty{color:var(--muted);font-size:13px;margin:10px 0 0}

details{margin-top:10px}
summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--blue);list-style:none;display:inline-flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
.dsec{margin-top:12px}
.dsec h4{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.bd{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.bd li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:4px 8px;border-radius:7px;background:var(--surface-2)}
.bd li span:first-child{min-width:0;word-break:break-all}
.bd li small{color:var(--muted)}
.bd li b{font-family:var(--f-num);white-space:nowrap}
.bd li.sum{background:transparent;border-top:1px solid var(--line);border-radius:0;font-weight:700}
.chk{display:flex;flex-direction:column;gap:4px}
.chk label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;font-size:13px;padding:5px 8px;border-radius:7px;background:var(--surface-2);cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--blue)}
.chk small{display:block;color:var(--muted);font-size:11px}
.chk .tg{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.chk .tg.kak{color:var(--cond)}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{background:var(--surface-2);border-radius:8px;padding:6px 8px}
.phead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;font-size:13px;cursor:pointer}
.phead input{margin-top:3px;accent-color:var(--blue)}
.phead small{display:block;color:var(--muted);font-size:11px}
.phead .tg{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.phead .tg.kak{color:var(--cond)}
.povs{display:flex;flex-direction:column;gap:4px;margin:6px 0 2px 26px}
.pov{display:grid;grid-template-columns:minmax(0,1fr) 90px 64px;gap:8px;align-items:center;font-size:12px}
.pov .pt{min-width:0;color:var(--muted);word-break:break-all}
.pov input{width:100%;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-family:var(--f-num);font-weight:700;font-size:14px}
.pov small{color:var(--muted);font-family:var(--f-num);white-space:nowrap}
.seal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 8px;align-items:center;font-size:13px}
.seal select{width:100%;min-width:0;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.seal .sl{font-size:12px;font-weight:700;color:var(--muted)}
.seal .lvs{width:auto}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.views{display:flex;gap:4px;margin:0 0 14px;border-bottom:2px solid var(--line);overflow-x:auto}
.views button{border:0;background:transparent;padding:10px 14px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.views button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--volt)}
.views .ls{display:none}
.opgrid{flex-basis:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
@media (min-width:900px){.opgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}}
.opcard{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface);min-width:0}
.ophead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}.ophead h3{margin:0;font-size:15px}
.opdesc{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.opmain{width:100%;padding:11px 14px;font-size:14px}
.btn.ink{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opsub{display:flex;flex-wrap:wrap;gap:8px}.opsub:empty{display:none}
.preset{display:inline-flex;gap:6px}.preset button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
.preset button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.sopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:8px 18px}
.sopt{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}.sopt .sl{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg2{flex:none;width:min(190px,64%);display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.seg2 button{border:0;background:transparent;padding:7px 4px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg2 button+button{border-left:1px solid var(--line)}
.sopt.stech{grid-column:1/-1;flex-wrap:wrap;align-items:flex-start}.sopt.stech .sl{padding-top:8px}
.seg2.seg4{flex:1 1 260px;width:auto;max-width:420px;grid-template-columns:1fr 1fr}.seg4 button{white-space:normal;line-height:1.3;overflow:visible}.seg4 button:nth-child(3){border-left:0}.seg4 button:nth-child(n+3){border-top:1px solid var(--line)}
.seg2.seg3{flex:1 1 260px;width:auto;max-width:420px;grid-template-columns:1fr 1fr 1fr}.seg3 button{white-space:normal;line-height:1.3;overflow:visible}
.opcol{display:flex;flex-direction:column;gap:12px;min-width:0}

}

</style></head>
<body>
<div id="loading" class="lock"><div class="lockbox"><div class="brand"><div class="bolt" aria-hidden="true"></div><h1>イナクロ計算ツール</h1></div><p id="loadingMsg">読み込み中…</p></div></div>
<div id="lockScreen" class="lock" hidden></div>
<div id="appWrap" hidden></div>
<script>/* ===== 入口：ログイン → 本体を受け取って起動 → データをサーバーに自動保存 ===== */
var __RESTORE=null;
(function(){
const API_URL="https://script.google.com/macros/s/AKfycbz4qbFr8T7ts284vsswFeCb3Jl557WUPkvNYF8fWphxFOlzw2idg024ayaUWDkzXYA/exec", ANN_ID="2026-10-18b";
const KEY='inazuma-trial-key', DEVKEY='inazuma-trial-dev', TOKKEY='inazuma-trial-session', DATAKEY='inazuma-trial-calc', OWNKEY='inazuma-trial-owner';
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const norm=c=>String(c||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DEV=ls.get(DEVKEY); if(!DEV){DEV=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());ls.set(DEVKEY,DEV)}
// Apps Script を fetch で呼ぶ（Cookie を送らないので、Googleのログイン状態に左右されない）
async function call(fn,...args){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),credentials:'omit',redirect:'follow'});
  if(!r.ok)throw new Error('サーバーの応答 '+r.status);
  const t=await r.text(); let j; try{j=JSON.parse(t)}catch(e){throw new Error('サーバーの応答がおかしい：'+t.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,80))} if(j.err)throw new Error(j.err); return j.r;
}
const UA=()=>{const u=navigator.userAgent;const os=/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':'その他';const br=/Edg\//.test(u)?'Edge':/CriOS|Chrome\//.test(u)?'Chrome':/FxiOS|Firefox/.test(u)?'Firefox':/Safari/.test(u)?'Safari':'その他';return os+' / '+br+' / '+screen.width+'x'+screen.height};
if(ANN_ID&&!ls.get('inazuma-trial-ann'))ls.set('inazuma-trial-ann',ANN_ID);

/* だいたいの地域（IPから）。取れなくてもログインは続ける */
let GEO=null;
async function geo(){
  if(GEO)return GEO;
  const get=async(url,map)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),3000);try{const r=await fetch(url,{signal:c.signal});return map(await r.json())}finally{clearTimeout(t)}};
  try{GEO=await get('https://ipapi.co/json/',j=>{if(!j||j.error)throw 0;return{ip:j.ip,region:j.region,city:j.city,country:j.country_name}})}catch(e){
    try{GEO=await get('https://ipwho.is/',j=>{if(!j||j.success===false)throw 0;return{ip:j.ip,region:j.region,city:j.city,country:j.country}})}catch(e2){GEO={}}}
  return GEO;
}
geo();

/* iframe の中ではクリップボードが使えないことがあるので、昔の方法で補う */
(function(){const cb=navigator.clipboard, orig=cb&&cb.writeText?cb.writeText.bind(cb):null;
  const legacy=t=>new Promise((res,rej)=>{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();ok?res():rej(new Error('copy'))});
  const w=t=>orig?orig(t).catch(()=>legacy(t)):legacy(t);
  try{if(cb)Object.defineProperty(cb,'writeText',{value:w,configurable:true});else Object.defineProperty(navigator,'clipboard',{value:{writeText:w},configurable:true})}catch(e){}
})();

/* 保存コード（INC1.）の読み書き */
const b64u=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function decodeSave(s){s=String(s||'').trim().replace(/\s+/g,'');
  if(s.startsWith('INC1.')){const r=new Response(new Blob([unb64u(s.slice(5))]).stream().pipeThrough(new DecompressionStream('deflate-raw')));return JSON.parse(new TextDecoder().decode(await r.arrayBuffer()))}
  if(s.startsWith('INC0.'))return JSON.parse(new TextDecoder().decode(unb64u(s.slice(5))));return null}
async function encodeSave(json){const u=new TextEncoder().encode(json);
  if(typeof CompressionStream==='undefined')return 'INC0.'+b64u(u);
  return 'INC1.'+b64u(new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()))}

/* 画面の出し分け */
function showOnly(id){['loading','lockScreen','appWrap'].forEach(x=>{const e=$(x);if(e)e.hidden=(x!==id)});const wm=document.querySelector('.wmark');if(wm)wm.hidden=(id!=='appWrap')}
function loading(msg){$('loadingMsg').textContent=msg||'読み込み中…';showOnly('loading')}
const brand='<div class="brand"><div class="bolt" aria-hidden="true"></div><h1>イナクロ計算ツール</h1></div>';

let MODE='code', HASPASS=false;
function lockUI(msg){
  stopSync();
  const el=$('lockScreen');
  el.innerHTML=`<form class="lockbox" id="lockForm" novalidate>${brand}
    <p>クラブメンバー専用です。</p>
    <div class="seg lockseg" role="tablist"><button type="button" data-mode="code" aria-pressed="${MODE==='code'}">コードで入る</button><button type="button" data-mode="pass" aria-pressed="${MODE==='pass'}">IDとパスワード</button></div>
    ${MODE==='code'?`<input id="lockCode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="メンバーコード" aria-label="メンバーコードまたは保存コード">
    <p class="hint">保存コードを貼っても入れます（そのデータが戻ります）。パスワードを決めた人は「IDとパスワード」で入ってください。</p>`
    :`<input id="lockId" class="plain" inputmode="numeric" autocomplete="username" placeholder="ゲームID" aria-label="ゲームID">
    <input id="lockPass" class="plain" type="password" autocomplete="current-password" placeholder="パスワード" aria-label="パスワード">
    <p class="hint">パスワードは、一度メンバーコードで入ったあとに決められます。忘れたときは管理者へ。</p>`}
    <button class="btn volt" type="submit">ログイン</button><div class="err" id="lockErr" role="alert"></div></form>`;
  showOnly('lockScreen'); window.scrollTo(0,0);
  $('lockErr').textContent=msg||'';
  el.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{MODE=b.dataset.mode;lockUI('')}));
  $('lockForm').addEventListener('submit',async ev=>{
    ev.preventDefault(); const err=$('lockErr'), btn=ev.target.querySelector('button[type=submit]');
    let req={via:MODE,dev:DEV,ua:UA()}, saved=null;
    if(MODE==='code'){
      const code=$('lockCode').value; req.code=code;
      if(/^\s*INC[01]\./.test(code)){
        try{saved=await decodeSave(code)}catch(e){saved=null}
        if(!saved||!saved.normal){err.textContent='保存コードを読み込めませんでした。途中で切れていないか確認してください。';return}
        if(!saved.__k){err.textContent='この保存コードにはメンバーコードが入っていません。メンバーコードで入ってから、「保存」タブで読み込んでください。';return}
        req.code=saved.__k;
      }
    }else{req.id=$('lockId').value;req.pass=$('lockPass').value;if(!req.id||!req.pass){err.textContent='ゲームIDとパスワードを入れてください。';return}}
    err.textContent='確認中…'; btn.disabled=true;
    req.geo=await geo();
    let r=null; try{r=await call('login',req)}catch(e){err.textContent='通信できませんでした（'+String(e&&e.message||e).slice(0,120)+'）';btn.disabled=false;return}
    if(!r.ok){err.textContent=r.msg;btn.disabled=false;if(/パスワードを決めてある/.test(r.msg)){MODE='pass';const m=r.msg;lockUI(m)}return}
    ls.set(TOKKEY,r.token); HASPASS=!!r.hasPass;
    if(MODE==='code')ls.set(KEY,norm(req.code));
    if(saved){delete saved.__k; __RESTORE=saved;}
    if(MODE==='code'&&!r.hasPass)return passUI(r.token,r.me,true);
    boot(r.token,r.me);
  });
}

/* パスワードを決める画面。first=true ならログイン直後（「あとで」で本体へ） */
function passUI(token,me,first){
  const el=$('lockScreen');
  el.innerHTML=`<form class="lockbox" id="passForm" novalidate>${brand}
    <p>${first?'パスワードを決めると、次からは<b>ゲームID</b>と<b>パスワード</b>で入ります。':'新しいパスワードを決めます。'}</p>
    ${first?'<p class="hint">決めたあとは、メンバーコードでは入れなくなります（コードが人に知られても、あなたのアカウントに入られないようにするためです）。</p>':''}
    <p class="hint">ゲームID：${esc(me.gid)||'（メンバー表に未登録）'}</p>
    ${HASPASS?'<input id="pw0" class="plain" type="password" autocomplete="current-password" placeholder="今のパスワード" aria-label="今のパスワード">':''}
    <input id="pw1" class="plain" type="password" autocomplete="new-password" placeholder="${HASPASS?'新しいパスワード（8文字以上）':'パスワード（8文字以上）'}" aria-label="新しいパスワード">
    <input id="pw2" class="plain" type="password" autocomplete="new-password" placeholder="もう一度" aria-label="パスワードをもう一度">
    <button class="btn volt" type="submit">このパスワードにする</button><button class="btn" type="button" id="pwLater">${first?'あとで':'やめる'}</button><div class="err" id="pwErr" role="alert"></div></form>`;
  showOnly('lockScreen'); window.scrollTo(0,0);
  const back=()=>first?boot(token,me):showOnly('appWrap');
  $('pwLater').addEventListener('click',back);
  $('passForm').addEventListener('submit',async ev=>{
    ev.preventDefault(); const a=$('pw1').value,b=$('pw2').value,cur=HASPASS?$('pw0').value:'',err=$('pwErr');
    if(HASPASS&&!cur){err.textContent='今のパスワードを入れてください。';return}
    if(a.length<8){err.textContent='8文字以上にしてください。';return}
    if(a!==b){err.textContent='2つのパスワードが違います。';return}
    err.textContent='保存中…';
    let r=null; try{r=await call('setPassword',token,a,cur)}catch(e){err.textContent='通信できませんでした。';return}
    if(!r.ok){if(r.reason)return kicked(r);err.textContent=r.msg;return}
    HASPASS=true; toast(first?'パスワードを決めました。次からは「IDとパスワード」で入ってください':'パスワードを変えました');
    back();
  });
}

/* ===== サーバーへの自動保存 ===== */
let SYNC=null; // {token, timer, last, busy, pending}
function syncText(t,cls){window.__syncText=t;const e=$('syncState');if(e){e.textContent=t;e.className=cls||'clean'}}
function stopSync(){if(SYNC){clearTimeout(SYNC.timer);clearInterval(SYNC.iv)}SYNC=null}
function schedule(v){if(!SYNC)return;SYNC.pending=v;clearTimeout(SYNC.timer);syncText('保存待ち…','clean');SYNC.timer=setTimeout(flush,2500)}
async function flush(){
  if(!SYNC||SYNC.pending==null||SYNC.busy)return; const v=SYNC.pending; SYNC.pending=null; SYNC.busy=true;
  if(v===SYNC.last){SYNC.busy=false;return}
  syncText('保存中…','clean');
  try{const inc=await encodeSave(v); const r=await call('saveState',SYNC.token,inc);
    if(!r.ok){SYNC.busy=false;if(r.reason==='kicked'||r.reason==='expired'||r.reason==='stopped')return kicked(r);syncText('保存できませんでした：'+r.msg,'dirty');return}
    SYNC.last=v; const d=new Date(); syncText('自動保存済み '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'),'clean');
  }catch(e){SYNC.pending=SYNC.pending==null?v:SYNC.pending;syncText('保存できませんでした（通信）。少しして自動でやり直します','dirty');SYNC.timer=setTimeout(flush,15000)}
  SYNC.busy=false; if(SYNC&&SYNC.pending!=null)flush();
}
const origSet=Storage.prototype.setItem;
Storage.prototype.setItem=function(k,v){origSet.call(this,k,v);if(k===DATAKEY&&this===window.localStorage)schedule(String(v))};
let lastCheck=0;
async function check(force){if(!SYNC)return;if(!force&&document.visibilityState!=='visible')return;if(Date.now()-lastCheck<20000&&!force)return;lastCheck=Date.now();try{const r=await call('ping',SYNC.token);if(!r.ok)kicked(r)}catch(e){}}
window.addEventListener('focus',()=>check(true));
document.addEventListener('pointerdown',()=>check(false),{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check(true);else flush()});

function kicked(r){
  stopSync(); ls.del(TOKKEY);
  const msg=r&&r.reason==='kicked'?'別の端末でログインされたので、この端末はログアウトしました。':r&&r.msg?r.msg:'ログインの期限が切れました。もう一度ログインしてください。';
  lockUI(msg);
}
function toast(t){const d=document.createElement('div');d.className='gtoast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ===== 本体を起動 ===== */
async function boot(token,me){
  loading('読み込み中…（はじめは数秒かかります）');
  let a=null; try{a=await call('loadApp',token)}catch(e){lockUI('読み込みに失敗しました（'+String(e&&e.message||e).slice(0,200)+'）');return}
  if(!a.ok){if(a.reason==='error'){lockUI(a.msg);return}return kicked(a)}
  // その人のデータを用意（ほかの人のデータが端末に残っていても使わない）
  let state=null, upload=false;
  if(__RESTORE){state=__RESTORE;upload=true}
  else if(a.saved){try{state=await decodeSave(a.saved)}catch(e){state=null}}
  else if(ls.get(OWNKEY)===String(me.no)&&ls.get(DATAKEY)){try{state=JSON.parse(ls.get(DATAKEY));upload=true}catch(e){}}
  ls.set(OWNKEY,String(me.no));
  if(state){delete state.__k; origSet.call(localStorage,DATAKEY,JSON.stringify(state))} else ls.del(DATAKEY);
  SYNC={token:token,last:upload?null:(state?JSON.stringify(state):null),pending:null,busy:false,timer:0};
  SYNC.iv=setInterval(check,60*1000);
  let P=null; try{P=JSON.parse(new TextDecoder().decode(new Uint8Array(await new Response(new Blob([Uint8Array.from(atob(a.pack),c=>c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())))}catch(e){lockUI('本体を開けませんでした（'+esc(e&&e.message||e)+'）');return}
  a.view=P.view; a.js=P.js;
  const w=$('appWrap'); w.innerHTML=a.view;
  showOnly('appWrap');
  try{(new Function(a.js))();const f=window.__APP_BOOT;delete window.__APP_BOOT;f(a.data,me)}
  catch(e){console.error(e);w.insertAdjacentHTML('afterbegin','<p style="color:#c00;font-weight:700">起動に失敗しました：'+esc(e&&e.message||e)+'</p>')}
  mark(token,me);
  syncText(a.saved||upload?'自動保存されます':'変えると自動で保存されます','clean');
  if(upload)schedule(ls.get(DATAKEY));
  __RESTORE=null;
}

function mark(token,me){
  const h=document.querySelector('#appWrap h1'); if(!h)return;
  const no2=String(me.no).padStart(2,'0');
  const b=document.createElement('div'); b.className='mebadge';
  const t=document.createElement('span'); t.textContent=me.master?'マスターキー':(me.name||'メンバー')+' さん（No.'+no2+'）';
  const p=document.createElement('button'); p.type='button'; p.textContent='パスワード'; p.addEventListener('click',()=>passUI(token,me,false));
  const x=document.createElement('button'); x.type='button'; x.textContent='ログアウト';
  x.addEventListener('click',async()=>{await flush();try{await call('logout',token)}catch(e){}stopSync();ls.del(TOKKEY);lockUI('ログアウトしました。')});
  b.append(t,p,x); h.parentElement.appendChild(b);
  if(!me.master){const old=document.querySelector('.wmark');if(old)old.remove();
    const w=document.createElement('div'); w.className='wmark'; w.setAttribute('aria-hidden','true');
    const label=[me.name,me.gid?('ID '+me.gid):'','No.'+no2].filter(Boolean).join(' ');
    for(let i=0;i<700;i++){const s=document.createElement('span');s.textContent=label;w.appendChild(s)}
    document.body.appendChild(w);}
}

async function start(){
  const tok=ls.get(TOKKEY);
  if(!tok){lockUI('');return}
  loading('ログインを確認しています…');
  let r=null; try{r=await call('resume',tok,DEV,UA(),await geo())}catch(e){lockUI('通信できませんでした。電波のよいところでもう一度開いてください。');return}
  if(!r.ok){ls.del(TOKKEY);return lockUI(r.reason==='kicked'?'別の端末でログインされたので、この端末はログアウトしました。':r.msg||'')}
  HASPASS=!!r.hasPass; boot(tok,r.me);
}
start();
})();
</script>
